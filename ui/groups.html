<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #fff;
        --fg: #1d1d1f;
        --muted: #6e6e73;
        --line: #d8d8df;
        --soft: #f0f0f5;
        --accent: #0066cc;
        --danger: #b42318;
        --mica: rgba(255, 255, 255, 0.62);
        --composer-border: rgba(110, 110, 115, 0.14);
        --composer-shadow: inset 0 1px 0 #ffffffad, 0 1px 2px #1f233014, 0 3px 8px #1f23301f;
        --hover: color-mix(in srgb, var(--fg) 8%, transparent);
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #282c34;
        --fg: #e2e8f0;
        --muted: #8892a4;
        --line: #454a55;
        --soft: #27272a;
        --accent: #2997ff;
        --danger: #ff6961;
        --mica: rgba(36, 36, 36, 0.64);
        --composer-border: rgba(255, 255, 255, 0.1);
        --composer-shadow: inset 0 1px 0 #ffffff14, 0 1px 2px #0000004d, 0 3px 8px #00000052;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          14px/1.6 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Inter",
          sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      main {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        gap: 7px;
        padding: 12px;
      }
      button,
      textarea,
      summary {
        font: inherit;
      }
      button,
      summary {
        cursor: pointer;
      }
      button {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 10px;
        color: inherit;
        background: transparent;
      }
      button:hover {
        background: var(--hover);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .group-heading-copy {
        flex: 1;
        min-width: 0;
      }
      #picker {
        position: relative;
      }
      summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        list-style: none;
        padding: 2px 0;
        background: transparent;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      summary::after {
        content: "";
        flex-shrink: 0;
        width: 6px;
        height: 6px;
        margin-right: 4px;
        border-right: 1.5px solid var(--muted);
        border-bottom: 1.5px solid var(--muted);
        transform: rotate(-45deg);
        transition: transform 120ms ease;
      }
      details[open] > summary::after {
        transform: rotate(45deg);
      }
      #group-title {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        font-weight: 700;
      }
      #message-count {
        display: block;
        color: var(--muted);
        font-size: 10px;
      }
      #refresh {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 0;
        color: var(--muted);
      }
      button svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      #choices {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        z-index: 5;
        padding: 6px;
        max-height: 220px;
        overflow: auto;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: var(--composer-shadow);
      }
      #choices button {
        display: block;
        text-align: start;
        width: 100%;
        border: 0;
      }
      #members {
        flex-shrink: 0;
      }
      #members summary {
        background: transparent;
        padding: 2px 0;
        color: var(--muted);
        font-size: 12px;
      }
      #member-list {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 6px;
      }
      #member-list button {
        font-size: 12px;
        padding: 3px 7px;
        border-radius: 999px;
        color: var(--muted);
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .message-stack {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      #messages {
        position: absolute;
        inset: 0;
        overflow: auto;
        overflow-x: hidden;
        padding: 0 8px 112px 0;
        scrollbar-width: thin;
        scrollbar-color: transparent transparent;
      }
      #messages:hover,
      #messages:focus-within {
        scrollbar-color: var(--line) transparent;
      }
      .message-group {
        min-width: 0;
        margin-top: 26px;
      }
      .message-group:first-of-type {
        margin-top: 0;
      }
      .speaker-divider {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 0 -4px 8px;
        padding: 6px 4px 7px;
        border-bottom: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
        background: var(--bg);
      }
      .speaker-divider strong {
        display: block;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--fg);
        font-size: 17px;
        font-weight: 650;
        line-height: 1.25;
      }
      .speaker-divider strong::first-letter {
        font-size: 1.35em;
        font-weight: 700;
      }
      .speaker-divider time {
        color: var(--muted);
        font-size: 10px;
        white-space: nowrap;
      }
      article {
        padding: 3px 4px;
      }
      article:first-of-type {
        padding-top: 0;
      }
      article p {
        margin: 3px 0 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #empty {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
      #error {
        color: var(--danger);
        margin: 0;
        overflow-wrap: anywhere;
      }
      [hidden] {
        display: none !important;
      }
      #skeleton {
        display: flex;
        flex-direction: column;
        gap: 26px;
      }
      .skeleton-row {
        height: 76px;
        background:
          linear-gradient(var(--soft), var(--soft)) 0 6px / 40% 20px no-repeat,
          linear-gradient(var(--soft), var(--soft)) 0 42px / 100% 12px no-repeat,
          linear-gradient(var(--soft), var(--soft)) 0 64px / 75% 12px no-repeat;
      }
      #composer {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 3;
        overflow: hidden;
        border: 1px solid var(--composer-border);
        border-radius: 18px;
        background: var(--mica);
        box-shadow: var(--composer-shadow);
        backdrop-filter: blur(24px) saturate(1.08);
      }
      #composer:focus-within {
        outline: 1px solid var(--accent);
      }
      textarea {
        display: block;
        width: 100%;
        resize: none;
        height: 78px;
        min-height: 64px;
        max-height: 160px;
        padding: 12px 54px 12px 18px;
        color: inherit;
        background: transparent;
        border: 0;
        outline: none;
        font-size: 14px;
        line-height: 1.47;
      }
      textarea::placeholder {
        color: var(--muted);
      }
      #send {
        position: absolute;
        bottom: 9px;
        right: 9px;
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 8px;
        padding: 0;
        background: var(--accent);
        color: #fff;
      }
      #send:hover:not(:disabled) {
        filter: brightness(0.9);
      }
      #send:disabled {
        opacity: 0.25;
      }
      @media (prefers-reduced-motion: reduce) {
        summary::after {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="toolbar">
        <div class="group-heading-copy">
          <details id="picker">
            <summary><span id="group-title"></span></summary>
            <div id="choices"></div>
          </details>
          <span id="message-count"></span>
        </div>
        <button id="refresh" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M13 6a5 5 0 1 0 .3 3M13 2v4H9" /></svg
          ><span id="refresh-label" class="sr-only"></span>
        </button>
      </div>
      <details id="members">
        <summary id="member-title"></summary>
        <div id="member-list"></div>
      </details>
      <p id="error" role="alert" hidden></p>
      <div class="message-stack">
        <div id="messages" role="log" aria-live="polite">
          <div id="skeleton" aria-busy="true">
            <div class="skeleton-row"></div>
            <div class="skeleton-row"></div>
            <div class="skeleton-row"></div>
          </div>
          <p id="empty" hidden></p>
        </div>
        <div id="composer">
          <textarea id="draft" rows="3" maxlength="16000" aria-describedby="hint"></textarea>
          <span id="hint" class="sr-only"></span
          ><button id="send" type="button">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 12V4m-4 4 4-4 4 4" /></svg
            ><span id="send-label" class="sr-only"></span>
          </button>
        </div>
      </div>
    </main>
    <script>
      (() => {
        const $ = (id) => document.getElementById(id);
        const copy = {
          en: {
            choose: "Choose a group",
            refresh: "Refresh",
            members: "Members",
            messageCount: "messages",
            empty: "No chat groups in this workspace. Ask the Agent to create a group.",
            noMessages: "No messages yet",
            placeholder: "Message the group; @name to notify a member",
            hint: "Enter to send · Shift+Enter for a new line",
            send: "Send",
            sending: "Sending…",
            user: "You",
            unknown: "Agent",
            unsupported:
              "This OpenAgent version does not support sidebar tools. Update the application.",
            failed: "Unable to load group messages. Use Refresh to retry.",
            timeout: "The group request timed out. Refresh to check its status.",
          },
          zh: {
            choose: "选择群组",
            refresh: "刷新",
            members: "成员",
            messageCount: "条消息",
            empty: "当前工作区暂无群组，可以让智能体创建群组。",
            noMessages: "暂无消息",
            placeholder: "向群组发送消息，@名字可通知成员",
            hint: "Enter 发送 · Shift+Enter 换行",
            send: "发送",
            sending: "发送中…",
            user: "你",
            unknown: "智能体",
            unsupported: "当前 OpenAgent 版本不支持侧栏工具，请更新应用。",
            failed: "无法加载群组消息，请点击刷新重试。",
            timeout: "群组请求超时，请刷新确认状态。",
          },
        };
        let ctx = null,
          generation = 0,
          serial = 0,
          groups = [],
          members = [],
          messages = [],
          selected = null,
          nextSeq = 0,
          sending = false,
          refreshing = false;
        const pending = new Map(),
          drafts = new Map();
        const language = () => (ctx?.locale?.startsWith("zh") ? "zh" : "en");
        const t = (key) => copy[language()][key];
        const draftKey = () => `${ctx?.workspace || ""}\u0000${selected || ""}`;
        function fail(error) {
          $("error").textContent = String(error?.message || error || t("failed"));
          $("error").hidden = false;
        }
        function request(tool_name, args = {}) {
          if (!ctx?.tool_calls) return Promise.reject(new Error(t("unsupported")));
          const request_id = String(++serial),
            scope = ctx.scope;
          return new Promise((resolve, reject) => {
            const timeout = setTimeout(() => {
              pending.delete(request_id);
              reject(new Error(t("timeout")));
            }, 25000);
            pending.set(request_id, { resolve, reject, timeout, scope });
            parent.postMessage(
              {
                type: "openagent:sidebar-tool-call",
                version: 1,
                request_id,
                scope,
                tool_name,
                arguments: args,
              },
              "*",
            );
          });
        }
        function labels() {
          document.documentElement.lang = language();
          document.documentElement.dataset.theme = ctx?.theme === "dark" ? "dark" : "light";
          $("refresh-label").textContent = t("refresh");
          $("refresh").title = t("refresh");
          $("refresh").setAttribute("aria-label", t("refresh"));
          $("draft").placeholder = t("placeholder");
          $("draft").setAttribute("aria-label", t("placeholder"));
          $("hint").textContent = t("hint");
          $("send-label").textContent = t(sending ? "sending" : "send");
          $("send").title = t(sending ? "sending" : "send");
          $("send").setAttribute("aria-label", t(sending ? "sending" : "send"));
          $("send").disabled = !selected || sending || !$("draft").value.trim();
          $("message-count").textContent = selected
            ? `${messages.length} ${t("messageCount")}`
            : "";
          $("group-title").textContent =
            groups.find((g) => g.id === selected)?.title || t("choose");
          $("member-title").textContent = `${t("members")} (${members.length})`;
          $("empty").textContent = t(groups.length ? "noMessages" : "empty");
        }
        function renderMessages() {
          const box = $("messages"),
            atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
          box.querySelectorAll(".message-group").forEach((node) => node.remove());
          let previousSender = null,
            group = null;
          for (const message of messages) {
            const article = document.createElement("article");
            article.dataset.messageId = message.id;
            const header = document.createElement("header"),
              name = document.createElement("strong"),
              time = document.createElement("time"),
              content = document.createElement("p");
            const sender = `${message.sender_type}:${message.sender_id || ""}`;
            name.textContent =
              message.sender_type === "user"
                ? t("user")
                : members.find((m) =>
                    [m.conversation_id, m.id, m.branch_id].includes(message.sender_id),
                  )?.role_name || t("unknown");
            const date = new Date(message.created_at);
            time.dateTime = date.toISOString();
            time.textContent = date.toLocaleTimeString(language(), {
              hour: "2-digit",
              minute: "2-digit",
            });
            content.textContent = message.content;
            header.append(name, time);
            if (sender !== previousSender) {
              group = document.createElement("section");
              group.className = "message-group";
              header.className = "speaker-divider";
              group.append(header);
              box.append(group);
              previousSender = sender;
            }
            article.append(content);
            group.append(article);
          }
          $("empty").hidden = messages.length > 0;
          if (atBottom) box.scrollTop = box.scrollHeight;
        }
        function renderMembers() {
          $("member-list").replaceChildren();
          for (const member of members) {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = member.role_name;
            button.onclick = () => {
              const name = /^[\p{L}\p{N}_-]+$/u.test(member.role_name)
                ? member.role_name
                : `"${member.role_name.replaceAll('"', "")}"`;
              $("draft").value += `@${name} `;
              drafts.set(draftKey(), $("draft").value);
              $("draft").focus();
              labels();
            };
            $("member-list").append(button);
          }
        }
        async function selectGroup(id) {
          drafts.set(draftKey(), $("draft").value);
          selected = id;
          messages = [];
          members = [];
          nextSeq = 0;
          $("draft").value = drafts.get(draftKey()) || "";
          $("picker").open = false;
          ++generation;
          labels();
          renderMembers();
          renderMessages();
          await refresh();
        }
        async function refresh() {
          if (refreshing) return;
          refreshing = true;
          const current = generation;
          try {
            const loaded = await request("chat_group_list");
            if (current !== generation) return;
            groups = loaded;
            if (!groups.some((g) => g.id === selected)) {
              selected = groups[0]?.id || null;
              messages = [];
              nextSeq = 0;
              $("draft").value = drafts.get(draftKey()) || "";
            }
            $("choices").replaceChildren();
            for (const group of groups) {
              const button = document.createElement("button");
              button.textContent = group.title;
              button.onclick = () => void selectGroup(group.id);
              $("choices").append(button);
            }
            if (selected) {
              const loadedMembers = await request("chat_group_list_members", {
                group_id: selected,
              });
              if (current !== generation) return;
              members = loadedMembers;
              let changed = false;
              for (;;) {
                const page = await request("chat_group_read_messages", {
                  group_id: selected,
                  from_seq: nextSeq,
                  limit: 200,
                  wait_secs: 0,
                });
                if (current !== generation) return;
                if (page.messages.length) {
                  messages.push(...page.messages);
                  nextSeq = page.next_seq;
                  changed = true;
                }
                if (page.messages.length < 200) break;
              }
              renderMembers();
              if (changed || !messages.length) renderMessages();
            } else {
              members = [];
              renderMembers();
              renderMessages();
            }
            $("error").hidden = true;
            labels();
            $("draft").disabled = !selected;
          } catch (error) {
            if (current === generation) fail(error);
          } finally {
            refreshing = false;
            if (current === generation) $("skeleton").hidden = true;
            else void refresh();
          }
        }
        window.addEventListener("message", (event) => {
          if (event.source !== parent || event.data?.version !== 1) return;
          const data = event.data;
          if (data.type === "openagent:sidebar-tool-result") {
            const wait = pending.get(data.request_id);
            if (!wait || wait.scope !== data.scope) return;
            clearTimeout(wait.timeout);
            pending.delete(data.request_id);
            if (!data.ok) {
              wait.reject(new Error(data.error));
              return;
            }
            const result = data.result;
            if (result?.isError) {
              wait.reject(new Error(result.content?.map((c) => c.text || "").join("\n")));
              return;
            }
            try {
              wait.resolve(JSON.parse(result.content.find((c) => c.type === "text").text));
            } catch (error) {
              wait.reject(error);
            }
          }
          if (data.type === "openagent:sidebar-context") {
            const changed = !ctx || ctx.workspace !== data.workspace;
            const scopeChanged = ctx && ctx.scope !== data.scope;
            if (changed || scopeChanged) {
              if (ctx) drafts.set(draftKey(), $("draft").value);
              ++generation;
              if (changed) {
                groups = [];
                members = [];
                messages = [];
                selected = null;
                nextSeq = 0;
              }
              for (const wait of pending.values()) {
                clearTimeout(wait.timeout);
                wait.reject(new Error("Scope changed"));
              }
              pending.clear();
              if (changed) $("draft").value = "";
              $("skeleton").hidden = false;
            }
            ctx = data;
            labels();
            if (changed || scopeChanged) void refresh();
            else renderMessages();
          }
        });
        $("refresh").onclick = () => void refresh();
        $("draft").oninput = () => {
          drafts.set(draftKey(), $("draft").value);
          labels();
        };
        $("draft").onkeydown = (event) => {
          if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
            event.preventDefault();
            void sendMessage();
          }
        };
        async function sendMessage() {
          const content = $("draft").value.trim();
          if (!content || !selected || sending) return;
          const current = generation,
            key = draftKey();
          sending = true;
          labels();
          $("send").disabled = true;
          try {
            await request("chat_group_send_message", { group_id: selected, content });
            drafts.delete(key);
            if (current === generation) {
              if ($("draft").value.trim() === content) $("draft").value = "";
              await refresh();
            }
          } catch (error) {
            if (current === generation) fail(error);
          } finally {
            sending = false;
            labels();
          }
        }
        $("send").onclick = () => void sendMessage();
        labels();
        $("draft").disabled = true;
        $("send").disabled = true;
        setInterval(() => {
          if (ctx && !document.hidden) void refresh();
        }, 2500);
        parent.postMessage({ type: "openagent:sidebar-ready", version: 1 }, "*");
      })();
    </script>
  </body>
</html>
